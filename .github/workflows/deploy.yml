# Rebuilds and publishes the site on every change to main (including every
# Save in Pages CMS). Runs build.py + Tailwind, then deploys to GitHub Pages.
name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (reads photo sizes)
        run: pip install "pillow>=10,<12"

      - name: Build pages
        run: python build.py --no-serve

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build styles
        run: npx -y tailwindcss@3.4.17 -i src/input.css -o style.css --minify

      - name: Collect public files
        run: |
          mkdir _site
          cp *.html style.css robots.txt sitemap.xml llms.txt _headers favicon.ico favicon.png _site/
          cp -r img fonts _site/
          find _site -name '*LOCAL-ONLY*' -delete

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
